  else if (button.dataset.previewRow !== undefined) void previewAsset(data.clips[Number(button.dataset.previewRow)].clips[Number(button.dataset.version)], button.dataset.whole === 'true', Number(button.dataset.version));
  else if (button.dataset.previewAsset !== undefined) void previewAsset(data.assets[Number(button.dataset.previewAsset)], true);
});

function csv(rows) {
  return '\uFEFF' + rows.map(row => row.map(value => {
    let s = String(value ?? '');
    if (/^[=+@]/.test(s) || /^-[^\d.]/.test(s)) s = "'" + s;
    return '"' + s.replaceAll('"','""') + '"';
  }).join(',')).join('\r\n') + '\r\n';
}
function exportData(type) {
  let content, name, mime;
  if (type === 'json') { content = JSON.stringify(data,null,2); name = 'sfx-three-versions.json'; mime = 'application/json'; }
  else {
    let rows;
    if (type === 'events') rows = [
      ['事件序号','开始秒','结束秒','动作类型','分类','角色','阶段','描述','画面依据','音层数'],
      ...data.events.map(e => [e.number,e.start,e.end,e.type,e.category,e.actor,e.phase,e.description,e.evidence,e.layers.length])
    ];
    else if (type === 'materials') rows = [
      ['素材ID','文件名','完整路径','文件字节','版本1次数','版本1时间','版本2次数','版本2时间','版本3次数','版本3时间'],
      ...data.assets.map(a => [a.id,a.fileName,a.path,a.bytes,...a.uses.flatMap(uses => [uses.length,uses.map(u => `${sec(u.start)}–${sec(u.end)} ${u.type}/${u.role}`).join(' | ')])])
    ];
    else {
      const fields = ['文件名','完整路径','贴片开始秒','贴片结束秒','持续秒','源截取秒','增益dB','淡入秒','淡出秒','循环','选材方式','依据'];
      rows = [['事件序号','动作开始秒','动作结束秒','动作类型','动作描述','画面依据','音层','素材变化','贴片边界变化','源截取变化','混音变化',...data.versions.flatMap((v,i)=>fields.map(f=>`版本${i+1}_${f}`))],
        ...data.clips.map(r => [r.eventNumber,r.eventStart,r.eventEnd,r.type,r.description,r.evidence,r.role,r.assetChanged,r.timelineChanged,r.sourceChanged,r.mixChanged,...r.clips.flatMap(c => [c.fileName,c.path,c.start,c.end,c.duration,c.sourceOffset,c.gainDb,c.fadeIn,c.fadeOut,c.loop,c.decisionSource,c.reason])])];
    }
    content = csv(rows); name = `sfx-${type}-comparison.csv`; mime = 'text/csv;charset=utf-8';
  }
  const url = URL.createObjectURL(new Blob([content],{type:mime}));
  const link = document.createElement('a'); link.href = url; link.download = name; link.click();
  setTimeout(() => URL.revokeObjectURL(url),10000);
}
document.querySelectorAll('[data-download]').forEach(button => button.addEventListener('click', () => exportData(button.dataset.download)));
renderTable();
</script>
